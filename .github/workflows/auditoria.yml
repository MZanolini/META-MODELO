name: Auditoria de processo (checagens 1-3)

on:
  push:

jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r auditoria/requirements.txt

      - run: python auditoria/audit.py --repo . --somente 1,2,3
